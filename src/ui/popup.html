<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="popupTitle">TMail Labels</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 data-i18n="popupTitle">TMail Labels</h1>
      <div id="sync-status" class="status idle">
        <span class="status-icon"></span>
        <span id="status-text" data-i18n="neverSynced">Never synced</span>
      </div>
    </header>

    <section class="accounts">
      <h2>Accounts</h2>
      <div id="accounts-list" class="list">
        <div class="loading" data-i18n="loading">Loading...</div>
      </div>
    </section>

    <section class="labels">
      <h2>Labels</h2>
      <div id="labels-list" class="list">
        <div class="placeholder" data-i18n="selectAccount">Select an account</div>
      </div>
      <div class="actions">
        <button id="add-label-btn" class="btn btn-primary" disabled>
          <span class="icon">+</span>
          <span data-i18n="addLabel">Add Label</span>
        </button>
      </div>
    </section>

    <section class="sync-actions">
      <button id="sync-btn" class="btn btn-large">
        <span class="icon sync-icon">↻</span>
        <span data-i18n="syncNow">Sync Labels Now</span>
      </button>
    </section>

    <section class="settings-section">
      <details>
        <summary data-i18n="settingsTitle">Settings</summary>
        <div class="settings">
          <label class="setting">
            <input type="checkbox" id="auto-sync" checked>
            <span data-i18n="autoSync">Auto-sync on startup</span>
          </label>
          <label class="setting">
            <span data-i18n="syncInterval">Sync interval (minutes)</span>
            <input type="number" id="sync-interval" min="0" max="60" value="15">
          </label>
        </div>
      </details>
    </section>
  </div>

  <!-- Add Label Dialog -->
  <div id="add-label-dialog" class="dialog hidden">
    <div class="dialog-content">
      <h3 data-i18n="addLabel">Add Label</h3>
      <form id="add-label-form">
        <div class="form-group">
          <label for="label-name" data-i18n="labelName">Name</label>
          <input type="text" id="label-name" required>
        </div>
        <div class="form-group">
          <label data-i18n="labelColor">Color</label>
          <div id="color-picker" class="color-picker">
            <button type="button" class="color-btn selected" data-color="#FF0000" style="background:#FF0000"></button>
            <button type="button" class="color-btn" data-color="#FF9900" style="background:#FF9900"></button>
            <button type="button" class="color-btn" data-color="#009900" style="background:#009900"></button>
            <button type="button" class="color-btn" data-color="#3333FF" style="background:#3333FF"></button>
            <button type="button" class="color-btn" data-color="#993399" style="background:#993399"></button>
            <button type="button" class="color-btn" data-color="#00CCCC" style="background:#00CCCC"></button>
            <button type="button" class="color-btn" data-color="#FF6666" style="background:#FF6666"></button>
            <button type="button" class="color-btn" data-color="#FFCC00" style="background:#FFCC00"></button>
          </div>
          <input type="hidden" id="label-color" value="#FF0000">
        </div>
        <div class="form-actions">
          <button type="button" class="btn" id="cancel-add-btn" data-i18n="cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" data-i18n="create">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
